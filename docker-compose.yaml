services:
  mempalace-mcp:
    image: mempalace:3.11.0
    container_name: mempalace-mcp
    # Use o UID/GID do dono de data/ e cache/ no host.
    user: "${MEMPALACE_UID:-1000}:${MEMPALACE_GID:-1000}"
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "0.5"
    volumes:
      - ./data:/data
      - ./cache:/tmp/.cache
    entrypoint:
      - python3
      - -m
      - mempalace.mcp_server
    command:
      - --palace
      - /data
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "5001"
    ports:
      - "127.0.0.1:5001:5001" # HTTP MCP (POST /mcp)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/healthz',timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
